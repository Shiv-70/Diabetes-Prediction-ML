<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diabetes Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background: #eef2ff;
            border-radius: 8px;
            color: #1e3a8a;
            font-weight: bold;
        }

        .disclaimer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Diabetes Prediction System</h1>

        <p class="subtitle">
            Machine Learning Based Diabetes Prediction
        </p>

        <form action="/predict" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label for="pregnancies">Pregnancies</label>
                    <input type="number" id="pregnancies"
                           name="pregnancies"
                           min="0" required>
                </div>

                <div class="form-group">
                    <label for="glucose">Glucose</label>
                    <input type="number" id="glucose"
                           name="glucose"
                           min="0" required>
                </div>

                <div class="form-group">
                    <label for="blood_pressure">Blood Pressure</label>
                    <input type="number" id="blood_pressure"
                           name="blood_pressure"
                           min="0" required>
                </div>

                <div class="form-group">
                    <label for="skin_thickness">Skin Thickness</label>
                    <input type="number" id="skin_thickness"
                           name="skin_thickness"
                           min="0" required>
                </div>

                <div class="form-group">
                    <label for="insulin">Insulin</label>
                    <input type="number" id="insulin"
                           name="insulin"
                           min="0" required>
                </div>

                <div class="form-group">
                    <label for="bmi">BMI</label>
                    <input type="number" id="bmi"
                           name="bmi"
                           step="0.1"
                           min="0" required>
                </div>

                <div class="form-group">
                    <label for="diabetes_pedigree">
                        Diabetes Pedigree Function
                    </label>
                    <input type="number" id="diabetes_pedigree"
                           name="diabetes_pedigree"
                           step="0.001"
                           min="0" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age"
                           name="age"
                           min="1" required>
                </div>

            </div>

            <button type="submit">
                Predict Diabetes
            </button>

        </form>

        {% if prediction %}
            <div class="result">
                {{ prediction }}
            </div>
        {% endif %}

        <p class="disclaimer">
            Disclaimer: This application is for educational purposes only
            and should not be considered a medical diagnosis.
        </p>

    </div>

</body>
</html>
